name: iOS build and tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build for the simulator
        run: >-
          xcodebuild -project breathing.xcodeproj -scheme breathing
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Unit tests on an available iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, ds in devices.items() if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')))
          ")
          xcodebuild -project breathing.xcodeproj -scheme breathing -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO -only-testing:breathingTests test
